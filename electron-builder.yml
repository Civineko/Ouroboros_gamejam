appId: com.civineko.ouroboros
productName: Ouroboros
asar: true
npmRebuild: false
compression: maximum

directories:
  output: release/desktop
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!node_modules/**/*"

mac:
  category: public.app-category.games
  icon: build/icon.png
  electronLanguages:
    - zh-CN
    - en-US
  target:
    - dir

win:
  icon: build/icon.png
  electronLanguages:
    - zh-CN
    - en-US
  signAndEditExecutable: false
  target:
    - target: portable
      arch:
        - x64

portable:
  artifactName: Ouroboros-${version}-Windows-${arch}.${ext}
